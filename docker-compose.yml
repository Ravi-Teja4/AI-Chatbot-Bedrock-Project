# =============================================================================
# Docker Compose — Local Development
# =============================================================================
# Usage:
#   docker compose up          → start all services
#   docker compose up backend  → start backend only
#   docker compose logs -f     → tail all logs
#   docker compose down        → stop and remove containers
#
# Services:
#   frontend  → Next.js dev server  (hot reload)  → http://localhost:3000
#   backend   → Express.js tsx watch (hot reload)  → http://localhost:5000
#   dynamodb  → DynamoDB Local                     → http://localhost:8000
#
# Note: This compose file uses volume mounts for hot reload.
#       For production deployment, use docker-compose.prod.yml.
# =============================================================================

name: ai-chat-platform

services:

  # ── DynamoDB Local ─────────────────────────────────────────────────────────
  # Amazon's official DynamoDB Local image — functionally identical to the
  # managed service for development purposes. Data persists via a named volume.
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: ai-chat-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/shell/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ai-chat-network

  # ── DynamoDB Table Bootstrap ───────────────────────────────────────────────
  # One-shot container that creates all required DynamoDB tables on first run.
  # Uses a condition dependency so it only runs after DynamoDB is healthy.
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: ai-chat-dynamodb-init
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creating DynamoDB tables..."

        aws dynamodb create-table \
          --table-name aichat-conversations \
          --attribute-definitions \
            AttributeName=userId,AttributeType=S \
            AttributeName=conversationId,AttributeType=S \
            AttributeName=updatedAt,AttributeType=S \
          --key-schema \
            AttributeName=userId,KeyType=HASH \
            AttributeName=conversationId,KeyType=RANGE \
          --global-secondary-indexes '[{
            "IndexName":"userId-updatedAt-index",
            "KeySchema":[
              {"AttributeName":"userId","KeyType":"HASH"},
              {"AttributeName":"updatedAt","KeyType":"RANGE"}
            ],
            "Projection":{"ProjectionType":"ALL"},
            "ProvisionedThroughput":{"ReadCapacityUnits":5,"WriteCapacityUnits":5}
          }]' \
          --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
          --endpoint-url http://dynamodb:8000 \
          --region us-east-1 2>/dev/null || echo "aichat-conversations already exists"

        aws dynamodb create-table \
          --table-name aichat-messages \
          --attribute-definitions \
            AttributeName=conversationId,AttributeType=S \
            AttributeName=messageId,AttributeType=S \
          --key-schema \
            AttributeName=conversationId,KeyType=HASH \
            AttributeName=messageId,KeyType=RANGE \
          --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
          --endpoint-url http://dynamodb:8000 \
          --region us-east-1 2>/dev/null || echo "aichat-messages already exists"

        aws dynamodb create-table \
          --table-name aichat-users \
          --attribute-definitions \
            AttributeName=userId,AttributeType=S \
          --key-schema \
            AttributeName=userId,KeyType=HASH \
          --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
          --endpoint-url http://dynamodb:8000 \
          --region us-east-1 2>/dev/null || echo "aichat-users already exists"

        aws dynamodb create-table \
          --table-name aichat-settings \
          --attribute-definitions \
            AttributeName=userId,AttributeType=S \
            AttributeName=settingKey,AttributeType=S \
          --key-schema \
            AttributeName=userId,KeyType=HASH \
            AttributeName=settingKey,KeyType=RANGE \
          --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
          --endpoint-url http://dynamodb:8000 \
          --region us-east-1 2>/dev/null || echo "aichat-settings already exists"

        echo "DynamoDB tables ready."
    networks:
      - ai-chat-network

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: deps          # Use deps stage for dev — mounts source via volume
    container_name: ai-chat-backend
    command: ["pnpm", "--filter", "@ai-chat/backend", "dev"]
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE_PREFIX: aichat
      LOG_LEVEL: debug
      LOG_PRETTY: "true"
      API_VERSION: v1
    volumes:
      # Mount source for hot reload — tsx watch detects changes
      - ./backend/src:/app/backend/src:ro
      - ./shared/src:/app/shared/src:ro
      # Prevent host node_modules from overriding container's
      - /app/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
    depends_on:
      dynamodb:
        condition: service_healthy
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ai-chat-network
    restart: unless-stopped

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: deps
    container_name: ai-chat-frontend
    command: ["pnpm", "--filter", "@ai-chat/frontend", "dev"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Points to backend container via Docker network
      NEXT_PUBLIC_API_URL: http://localhost:5000
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./frontend/public:/app/frontend/public:ro
      - ./shared/src:/app/shared/src:ro
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-chat-network
    restart: unless-stopped

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  ai-chat-network:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  dynamodb_data:
    driver: local
