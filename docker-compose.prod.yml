# =============================================================================
# Docker Compose — Production (EC2 Deployment)
# =============================================================================
# Usage on EC2:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml pull   (after ECR push)
#   docker compose -f docker-compose.prod.yml down
#
# Prerequisites on EC2:
#   1. Docker and Docker Compose installed
#   2. aws ecr get-login-password piped to docker login
#   3. .env.prod file populated (never committed to git)
#
# Image tags:
#   Images are pulled from ECR using the REGISTRY and IMAGE_TAG env vars.
#   Set these in your CI/CD pipeline or EC2 environment.
#
#   export REGISTRY=<account-id>.dkr.ecr.us-east-1.amazonaws.com
#   export IMAGE_TAG=<git-sha>   (or "latest" for simple deployments)
#
# Note: DynamoDB is NOT in this compose file — production uses AWS DynamoDB.
# =============================================================================

name: ai-chat-platform-prod

services:

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    image: ${REGISTRY}/ai-chat-backend:${IMAGE_TAG:-latest}
    container_name: ai-chat-backend
    ports:
      - "5000:5000"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      LOG_PRETTY: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ai-chat-network
    restart: always
    # Resource limits — tune based on EC2 instance type
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    image: ${REGISTRY}/ai-chat-frontend:${IMAGE_TAG:-latest}
    container_name: ai-chat-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # In production, NEXT_PUBLIC_API_URL is baked into the image at build time.
      # Set it as a build ARG in your CI/CD pipeline:
      #   docker build --build-arg NEXT_PUBLIC_API_URL=https://api.yourdomain.com
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ai-chat-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  ai-chat-network:
    driver: bridge
